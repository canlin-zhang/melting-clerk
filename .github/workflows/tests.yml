name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No third-party imports in the suite: the hooks and core are stdlib only,
      # and memory_server.py (which needs mcp) is not exercised here.
      - run: python -m unittest discover -s tests -t . -v
